<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kapkanov Developer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="preloader" class="preloader">

     <div class="scene scene-kapkanov" id="scene-kapkanov">
      <h1 class="kapkanov-text" id="kapkanov-text">KAPKANOV.DEV</h1>
    </div>

    <div class="scene scene-code" id="scene-code">
      <div class="code-editor-mockup glass">
        <div class="editor-header">
          <span class="dot red"></span>
          <span class="dot yellow"></span>
          <span class="dot green"></span>
          <span class="editor-title">main.js</span>
        </div>
        <pre class="editor-body"><code id="typed-code"></code><span class="typing-cursor" id="cursor">_</span></pre>
      </div>
    </div>

    <div class="scene scene-console" id="scene-console">
      <div class="code-editor-mockup glass console-mockup">
        <div class="editor-header">
          <span class="dot red"></span>
          <span class="dot yellow"></span>
          <span class="dot green"></span>
          <span class="editor-title">terminal</span>
        </div>
        <pre class="editor-body console-body"><span class="console-prompt" id="console-line"></span><span class="typing-cursor" id="console-cursor">_</span></pre>
      </div>
    </div>

  </div>

  <div class="controls-bar">
    <div class="control-group theme-switch-wrapper">
      <span class="theme-icon-left">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
      </span>
      <label class="theme-switch">
        <input type="checkbox" id="theme-toggle-checkbox">
        <span class="slider"></span>
      </label>
      <span class="theme-icon-right">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </span>
    </div>
  </div>

  <div class="sky" aria-hidden="true">
    <div class="clouds" id="clouds"></div>
    <div class="stars" id="stars"></div>
  </div>

  <main class="page">
    <section class="hero glass">
      <div class="status">
        <span class="status-dot"></span>
        <span>www</span>
      </div>
      <div class="profile-image">
        <img src="image.png" alt="Stanislav Kapkanov" class="profile-photo">
      </div>
      <h1>Stanislav Kapkanov</h1>
      <p class="hero-description">Fullstack Dev | Node.js, JS/TS, Dart, Go, Python, HTML/CSS</p>
      <nav class="socials">
        <a class="social" href="checker/" data-redirect="https://github.com/kapkandev">
          <svg class="icon" viewBox="0 0 24 24"><path d="M12 .7a11.3 11.3 0 0 0-3.57 22.02c.57.1.78-.25.78-.55v-2.16c-3.18.69-3.85-1.35-3.85-1.35-.52-1.32-1.27-1.67-1.27-1.67-1.04-.71.08-.7.08-.7 1.15.08 1.76 1.18 1.76 1.18 1.02 1.75 2.68 1.25 3.33.96.1-.74.4-1.25.72-1.54-2.54-.29-5.21-1.27-5.21-5.66 0-1.25.45-2.27 1.18-3.07-.12-.29-.51-1.46.11-3.04 0 0 .97-.31 3.17 1.17a11 11 0 0 1 5.77 0c2.2-1.48 3.16-1.17 3.16-1.17.63 1.58.24 2.75.12 3.04.73.8 1.17 1.82 1.17 3.07 0 4.4-2.68 5.37-5.23 5.65.41.36.78 1.08.78 2.18v3.23c0 .3.21.66.79.55A11.3 11.3 0 0 0 12 .7Z"/></svg>
          GitHub
        </a>
        <a class="social" href="checker/" data-redirect="https://www.npmjs.com/~kapkandev">
          <svg class="icon" viewBox="0 0 24 24"><path d="M2 2h20v20H2V2Zm3 3v14h7V8h4v11h3V5H5Zm3 3h2v8H8V8Z"/></svg>
          npm
        </a>
      </nav>
    </section>

    <a class="repo-button" href="checker/" data-redirect="https://github.com/kapkandev/bio">
      <svg class="icon" viewBox="0 0 24 24"><path d="M12 .7a11.3 11.3 0 0 0-3.57 22.02c.57.1.78-.25.78-.55v-2.16c-3.18.69-3.85-1.35-3.85-1.35-.52-1.32-1.27-1.67-1.27-1.67-1.04-.71.08-.7.08-.7 1.15.08 1.76 1.18 1.76 1.18 1.02 1.75 2.68 1.25 3.33.96.1-.74.4-1.25.72-1.54-2.54-.29-5.21-1.27-5.21-5.66 0-1.25.45-2.27 1.18-3.07-.12-.29-.51-1.46.11-3.04 0 0 .97-.31 3.17 1.17a11 11 0 0 1 5.77 0c2.2-1.48 3.16-1.17 3.16-1.17.63 1.58.24 2.75.12 3.04.73.8 1.17 1.82 1.17 3.07 0 4.4-2.68 5.37-5.23 5.65.41.36.78 1.08.78 2.18v3.23c0 .3.21.66.79.55A11.3 11.3 0 0 0 12 .7Z"/></svg>
      OpenSource Repository
    </a>

    <footer>
      <span>© <span id="year"></span> | Kapkanov Developer</span>
    </footer>
  </main>

  <script src="preload.js"></script>
  <script src="script.js"></script>
</body>
</html>
